contract_anomaly_rules_version: v3
study:
  max_forward_hours: 168
  baseline_max_draws: 100000
  bootstrap:
    n_boot: 1000
    alpha: 0.05
    min_events: 30
    min_events_bucketed: 10
triggers:
  liq_cascade_short:
    description: 空头强平级联（轧空燃料候选，偏做多）
    feature: liq_short_z
    threshold: 2.0
    direction: above
    price_filter:
      feature: ret_24h
      threshold: 5.0
      direction: below
    cooldown_hours: 48
  liq_cascade_long:
    description: 多头强平级联（下跌燃料候选，偏做空）
    feature: liq_long_z
    threshold: 2.0
    direction: above
    price_filter:
      feature: ret_24h
      threshold: -5.0
      direction: above
    cooldown_hours: 48
  cvd_bull_divergence:
    description: 价格拉升但 CVD 未跟上（上涨量能衰竭候选）
    feature: cvd_divergence
    threshold: -2.0
    direction: below
    price_filter:
      feature: ret_24h
      threshold: 3.0
      direction: above
    cooldown_hours: 48
  cvd_bear_divergence:
    description: 价格新低但 CVD 未跟随（下跌量能衰竭候选）
    feature: cvd_divergence
    threshold: 2.0
    direction: above
    price_filter:
      feature: ret_24h
      threshold: -3.0
      direction: below
    cooldown_hours: 48
  wash_cvd:
    description: washout 出清 + CVD 卖压枯竭确认（A 线最优，115 组合研究 3/4 episode GO_LONG）
    feature: washout
    threshold: 0.5
    direction: above
    price_filter:
      feature: cvd_divergence
      threshold: 2.0
      direction: above
    signal_direction: Long
    cooldown_hours: 72
    vix_gate:
      enabled: true
      quantile_window_days: 365
      quantile: 0.75
      asof_days_back: 1
      behavior: annotate
    e29_gate:
      description: E29 本地-全球冲击环境标注（211：近期好环境 24h +1.24% vs 坏 -0.34%；annotate-only
        不改触发）
      enabled: true
      behavior: annotate
      threshold: 0.5
      asof_days_back: 1
  top_trader_short_extreme:
    description: top trader 空头极值（拥挤空头，轧空候选）
    feature: top_ratio_rank
    threshold: 0.05
    direction: below
    cooldown_hours: 48
  top_trader_long_extreme:
    description: top trader 多头极值（拥挤多头，回落候选）
    feature: top_ratio_rank
    threshold: 0.95
    direction: above
    cooldown_hours: 48
