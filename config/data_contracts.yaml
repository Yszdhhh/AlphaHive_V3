# AlphaHive V3.1.1 Phase 1 - 原始输入数据契约
# schema 定义 + 校验规则，供脚本读取前校验。是原始数据的【单一真理源】。
schema_version: v4
compatibility:
  previous_schema_versions: [v1, v2, v3]
  unknown_fields: ignore
  migration: additive_only
funding:
  source_path_template: "C:\\Users\\10639\\Desktop\\🔒 加密资产\\coinglass_db\\raw_1h\\funding_ohlc\\{SYMBOL}.parquet"
  raw_unit: percent
  ohlc_field_used: close
  normalized_unit: decimal
  normalize_op: "raw_close / 100"
  raw_assertion:
    median_abs_min: 0.0008
    abs_max: 3.0
    on_fail: STOP_AND_REPORT_OWNER
  normalized_assertion:
    derived_from: raw_assertion
    conversion_factor: 0.01
    # 不在 normalized 层复制上下限；硬 STOP 只由 raw_assertion 定义。
    on_fail: STOP_AND_REPORT_OWNER
  sampling:
    source_resolution: 1h
    settlement_period_hours: 8
    deduplication: last_observation_per_utc_settlement_window
    timestamp_anchor: unix_epoch_utc
  periods_per_day: 3
  annualize_formula: "rate_8h_decimal * 3 * 365"

# ---- 数据源路径（PC端启动前务必人工核对真实路径，记忆可能过时）----
sources:
  klines:
    path_template: "G:\\Quant test\\AlphaHive_V3\\harness\\canonical_price_snapshots\\current.json"
    publication_layout: "current.json -> vNNNN/manifest.json -> klines/{SYMBOL}.parquet"
    source_precedence: "BINANCE_OVER_COINGLASS"
    source_role: "canonical_price_snapshot"
    resolution: 1h
    start_expected: "2021-12"       # ~53mo
    required_columns: [timestamp, open, high, low, close, volume]
    timezone: UTC                   # ⚠️ 启动前确认时间戳时区
  funding:
    path_template: "C:\\Users\\10639\\Desktop\\🔒 加密资产\\coinglass_db\\raw_1h\\funding_ohlc\\{SYMBOL}.parquet"
    resolution: 1h                  # ⚠️ 确认真实分辨率(可能8h)
    start_expected: "2024-06"       # ~23.6mo
    required_columns: [time, close]
  oi:
    path_template: "C:\\Users\\10639\\Desktop\\🔒 加密资产\\coinglass_db\\raw_1h\\oi_ohlc\\{SYMBOL}.parquet"
    resolution: 1h
    start_expected: "2024-06"
    required_columns: [timestamp, open_interest]

# ---- 字段校验规则 ----
validations:
  price:
    open: {type: float, min: 0, allow_null: false}
    high: {type: float, min: 0, allow_null: false}
    low:  {type: float, min: 0, allow_null: false}
    close: {type: float, min: 0, allow_null: false}
    volume: {type: float, min: 0, allow_null: true}
    ohlc_consistency: "high >= low AND high >= open AND high >= close AND low <= open AND low <= close"

  # ⚠️⚠️⚠️ 关键：funding 单位断言（历史被咬三次）⚠️⚠️⚠️
  funding_rate:
    type: float
    unit_assertion:
      description: >
        正常 crypto 8h funding 中位数绝对值 ~1e-4 (0.01% 中性基线)，极端 ±1%~2%。
        若中位数被多除100会掉到 ~1e-6 量级。据此判单位坑；这里只做解释，不复制 STOP 阈值。
      # 历史诊断值 1e-5 仅供回顾旧报告，不是第二套通过标准。
      median_abs_expected: 0.0001  # 正常量级参考 (~0.01%/8h)
      derived_bounds_ref: "funding.raw_assertion"
      on_fail: "STOP_AND_REPORT_OWNER"

  open_interest:
    type: float
    min: 0
    allow_null: true
    absolute_value_status: NOT_DECLARED
    absolute_value_unit: NOT_DECLARED
    change_24h_pct:
      field: oi_change_pct_24h
      semantics: ratio_percent
      formula: "(current_open_interest / prior_open_interest - 1) * 100"
      unit_independent: true
      description: "OI变化%按前值归一化的比率使用；不把绝对 OI 推断为任何货币单位。"

# ---- 时间戳对齐 ----
timestamp:
  format: unix_ms_or_iso        # 启动前确认
  timezone: UTC
  align_across_symbols: true    # BTC对冲价必须与标的同时间戳（硬约束4）
  completed_bar_semantics:
    resolution: 1h
    rule: "bar_open + 1h <= effective_cutoff"
    description: "只保留已完成的 1h bar；bar_open 是开盘时间，effective_cutoff 是有效数据截止时间。"

# ---- 缺失数据策略 ----
missing_data:
  spread:
    available: false
    action: force_paper_review_required
    estimated_value_is_real_check: false
  depth:
    available: false
    action: force_paper_review_required
    estimated_value_is_real_check: false
  funding_sign: {required: true, action: "force_extract_from_data"}

# ---- 快照契约（洞2）----
snapshot:
  format: long_table            # 每标的×每根K线，NOT 单行横截面
  lookback_days: 90
  must_include: [ohlcv]
  optional_dimensions: [funding, oi]
  missing_optional_dimension_action: "mark_unavailable_and_disable_dependent_metrics"
  immutable: true               # 一次冻结永不改

canonical_price_bridge:
  publication_root: "G:\\Quant test\\AlphaHive_V3\\harness\\canonical_price_snapshots"
  pointer_file: current.json
  source_precedence: "BINANCE_OVER_COINGLASS"
  no_interpolation: true
  gap_policy:
    fresh_guard_hours: 48
    max_gap_bars_outside_guard: 4
    max_missing_bars_90d: 6
    lookback_days: 90
  derivative_status: "NOT_INCLUDED"



