# 因子漏斗配置（2026-08-09 建立，codex 审查 + grok 独立分析合成版）
# 三级漏斗：S0 沙盒（廉价筛选，不宣布 GO）→ S1 挑战者（一次 holdout 冻结唯一规格）→ S2 确认（前向）
# 关键纪律：历史数据（2026-08 前所有 wash_cvd 条件研究）= development，不得再称独立确认。
development_cutoff: "2026-08-09"

# 已保留调制器（沙盒新概念须报与其相关性，|ρ| 过高只报 residual）
retained_modulators:
  - vol_ratio        # E03 放量（历史 >1.5 有效、>2.0 递减 = 饱和）
  - vix_env          # E24b/123 VIX 环境（⚠️ 语义冲突待核对：108 高 VIX 回避 vs E24b 高波动更强）
  - local_shock      # E29 本地-全球冲击（211，+1.74% 候选）
  - fng_greed        # E06 贪婪层（132，丢正期望）
  - breadth          # E05 广度分层（127，宜分层不作硬门）
  - liq_short_z      # E02 空头强平激增（131，+4.44%）
  - conf4h           # E18 4h 确认（148，二元确认层，不连续化）

# 已关闭概念族（禁止换皮重测，除非新数据/新机制/Owner 明示）
closed_families:
  - id: single_feature_extreme   # 153：16 形态全 NO_GO
    evidence: scripts/153_operator_search.py
  - id: funding_family           # 112/114/146/147/162：funding 裸反转/OI 交叉全证伪
    evidence: reports/funding_reset_study.md
  - id: meta_labeling            # 177/178：AUC 0.592/0.528 双目标失败
    evidence: reports/external_intel/meta_labeling_firstpass.md
  - id: stablecoin_etf_netflow   # 128/139/140/210：资金面三大维度全部无调制
    evidence: reports/exchange_netflow_recheck.md
  - id: cvd_slope                # 207：被 E18 4h 确认覆盖
    evidence: reports/cvd_slope_test.md
  - id: attention_sentiment      # 211 因子7：F&G 之上无 marginal
    evidence: reports/attention_shock_factors.md
  - id: oi_quadrant              # 141：主对照不显著
    evidence: reports/oi_quadrant_cross.md

# 沙盒配额（grok 收紧版）：每季 ≤8 概念 × ≤2 预声明形态
sandbox:
  max_concepts_per_quarter: 8
  max_forms_per_concept: 2
  min_coverage: 0.30       # 覆盖 <30% 降级窄域观察
  min_events: 200

# 允许的形态词典（S0 只能从中选，先写后算）
allowed_forms:
  - rank                 # robust percentile，跨币尺度/重尾
  - log_ratio            # signed-log + robust z，比率/冲击
  - capped_hinge         # 单调增强后饱和（放量 1.0→2.0 用）
  - binary_diag          # 二元仅做阈值诊断，不作默认实现

# 前向分数规格（108/109 标注用，2026-08-09 codex 规划 + grok 审查）
# 纪律：status=FROZEN 且 timestamp>=forward_start 且 trigger∈applicable_triggers 才计算；
# 否则全 NA（0 是有效低分，NA 是"不适用/不可用"，不可混淆）。
# ⚠️ FAM-001 尚未 S1 冻结（S0 合格），status 保持 PARK → 108/109 输出全 NA 直到冻结。
forward_scores:
  score_vol:
    spec_id: FAM-001
    status: PARK            # 2026-08-09 S1（214）holdout 未确认（CI 含 0）→ 保持关闭，不激活
    applicable_triggers: [wash_cvd]
    forward_start: null     # 冻结时填精确 UTC（部署后首个完整 1h bar），禁止倒填
    form: capped_hinge
    source_feature: qv24_ratio
    qv_window_hours: 24
    baseline_window_hours: 720
    baseline_min_periods: 24   # 与 scripts/213 的 feature_vol_ratio 完全一致（grok 硬条件）
    lo: 1.0
    hi: 2.0
