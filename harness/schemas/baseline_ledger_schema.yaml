# AlphaHive V3.1.1 - Baseline_Ledger schema
# 随机基线对照账本。每条非-AutoSkipped 候选须有基线A(候选池随机)+基线B(全池随机)
schema_version: v1

fields:
  schema_version: {type: str, required: true, allowed: [v1]}
  run_id: {type: str, required: true}
  baseline_id: {type: str, required: true, unique: true}
  parent_record_id: {type: str, required: true}          # 关联 Anomaly_Ledger.record_id
  baseline_type: {type: str, required: true, allowed: [candidate_pool_random, full_pool_random]}
  scan_time_utc: {type: datetime, required: true, tz: UTC}   # 与父候选同一时刻(三对齐)
  symbol: {type: str, required: true}                    # 随机抽中的标的
  random_seed: {type: str, required: true}               # md5(scan_time_utc+record_id+baseline_type)
  direction: {type: str, required: true, allowed: [Long, Short]}  # 随机分配(三对齐)
  direction_sign: {type: int, required: true, allowed: [1, -1]}
  holding_period_hours: {type: int, required: true, allowed: [4, 24, 72, 168]}
  entry_price_ref: {type: float, required: true, min: 0}
  exit_price_ref: {type: float, required: false, min: 0}
  btc_entry_price: {type: float, required: true, min: 0}
  btc_exit_price: {type: float, required: false, min: 0}
  dir_excess_ret: {type: float, required: false}
  friction_bps_roundtrip: {type: float, required: false, min: 0}
  funding_cost_component: {type: float, required: false}
  dir_excess_ret_net: {type: float, required: false}
  notes: {type: str, required: false}

cross_field_rules:
  - "direction=Long → direction_sign=1; direction=Short → direction_sign=-1"
  - "同一 parent_record_id 必须同时存在 candidate_pool_random 和 full_pool_random 两条"
  - "baseline 的 scan_time_utc/holding_period 必须与父候选一致(三对齐)"
  - "random_seed 必须能由 md5(scan_time_utc+parent_record_id+baseline_type) 复现(回归闸)"

regression_gate:
  description: "重跑时 random_seed 决定的抽样结果须完全复现"
