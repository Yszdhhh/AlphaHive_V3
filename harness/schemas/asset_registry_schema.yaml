# AlphaHive V3.2 - Asset_Registry schema
# 资产身份注册表行 schema：供 99_validate_schema.py 校验 data/reference/asset_registry.parquet
schema_version: v1

compatibility:
  accepted_versions: [v1]
  unknown_fields: ignore

fields:
  schema_version: {type: str, required: true, allowed: [v1]}
  symbol: {type: str, required: true, unique: true}          # 合约符号，如 1000BONKUSDT
  base_asset: {type: str, required: true}                   # 标准资产名（大写）
  multiplier: {type: float, required: true, min: 1}         # 合约倍率（1=无倍率）
  quote: {type: str, required: true, allowed: [USDT, USD_PERP, USD, BUSD]}
  mapping_status: {type: str, required: true, allowed: [VERIFIED, UNVERIFIED, OVERRIDE, UNRESOLVED]}
  coingecko_id: {type: str, required: false}                # 备源价格按 id 查
  note: {type: str, required: false}

# ---- 跨字段一致性规则 ----
cross_field_rules:
  - "mapping_status=UNRESOLVED → base_asset 为空"
  - "mapping_status=OVERRIDE → 该 symbol 必须在 asset_mapping_overrides.yaml 中有记录"
  - "multiplier>1 → base_asset 是去倍率前缀后的资产名（如 BONK/PEPE）"
